name: Comment on Issue

on:
    issues:
        types: [opened, edited, reopened]
    workflow_dispatch:
        inputs:
            issue_number:
                description: 'Issue number to run the check issue job against'
                required: true
                type: number

jobs:
    check-issue:
        name: Check issue
        runs-on: ubuntu-slim
        timeout-minutes: 5
        permissions:
            issues: write
        if: |
            github.event_name == 'workflow_dispatch' ||
              (github.event_name == 'issues' &&
              contains(fromJSON('["opened", "edited"]'), github.event.action) &&
              !github.event.issue.locked &&
              github.event.sender.login != 'issuehunt-oss[bot]' &&
              !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
        outputs:
            closed: ${{ steps.check.outputs.closed }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: lts/*
                  cache: 'pnpm'
            - name: Install dependencies (pnpm) # import remark-parse and unified
              run: pnpm i
            - name: Check issue format
              id: check
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  ISSUE_NUMBER: ${{ inputs.issue_number }}
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const { default: invalidIssue } = await import('${{ github.workspace }}/scripts/workflow/test-issue/check-issue.mjs')
                      const invalid = await invalidIssue({ github, context, core })
                      core.setOutput('closed', invalid ? 'true' : 'false')

    agentscan:
        name: AgentScan
        runs-on: ubuntu-slim
        timeout-minutes: 10
        permissions:
            issues: write
        if: ${{ github.event_name == 'issues' && github.event.action == 'opened' && github.event.sender.login != 'issuehunt-oss[bot]' && github.repository == 'DIYgod/RSSHub' }}
        outputs:
            classification: ${{ steps.scan.outputs.classification }}
            communityFlagged: ${{ steps.scan.outputs.community-flagged }}
        steps:
            - name: AgentScan
              id: scan
              uses: MatteoGabriele/agentscan-action@8112fb79b33fafb8506159df20129a34209ac410 # v2.5.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  scan-pull-requests: false
                  scan-issues: true
                  trusted-author-associations: 'collaborator,member,owner'
                  label-community-flagged: spam
                  label-mixed: spam
                  label-automation: spam
                  auto-close: true
                  auto-close-classifications: automation,mixed

    call-maintainers:
        name: Call maintainers
        needs: [check-issue, agentscan]
        runs-on: ubuntu-slim
        timeout-minutes: 5
        permissions:
            issues: write
        if: |
            !cancelled() &&
            github.event_name == 'issues' &&
            !github.event.issue.locked &&
            github.event.sender.login != 'issuehunt-oss[bot]' &&
            (needs.check-issue.result == 'success' || needs.check-issue.result == 'skipped') &&
            needs.check-issue.outputs.closed != 'true' &&
            needs.agentscan.outputs.communityFlagged != 'true' &&
            !contains(fromJSON('["mixed", "automation"]'), needs.agentscan.outputs.classification)
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: lts/*
                  cache: 'pnpm'
            - name: Install dependencies (pnpm) # import remark-parse and unified
              run: pnpm i
            - name: Generate feedback
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const { default: callMaintainer } = await import('${{ github.workspace }}/scripts/workflow/test-issue/call-maintainer.mjs')
                      await callMaintainer({ github, context, core })
