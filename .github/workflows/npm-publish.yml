name: npm Publish

on:
    workflow_dispatch: {}

permissions:
    id-token: write # Required for OIDC

jobs:
    build:
        name: npm publish
        if: github.repository == 'DIYgod/RSSHub' && github.ref_type == 'tag'
        # Not ubuntu-slim: its single CPU takes about twice as long to install and build, and it counts toward the same concurrent job limit
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: lts/*
                  cache: 'pnpm'
                  registry-url: 'https://registry.npmjs.org'
            - name: Install dependencies (pnpm)
              run: pnpm i
            - name: Run postinstall script for dependencies
              run: pnpm rb
            - name: Release
              run: pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --no-git-checks
            - name: Publish to npmjs
              run: pnpm publish --access public --tag latest --no-git-checks
