blockExoticSubdeps: false
minimumReleaseAge: 0

allowBuilds:
    bufferutil: true
    core-js: true
    es5-ext: true
    esbuild: true
    eslint-nibble: true
    patchright: true
    patchright-core: true
    protobufjs: true
    rolldown: true
    sharp: true
    sleep: true
    unrs-resolver: true
    utf-8-validate: true
    vue-demi: true
    workerd: true
    wrangler: true

overrides:
    '@oxc-parser/binding-wasm32-wasip1>@emnapi/core': '2.0.0-beta.2'
    '@oxc-parser/binding-wasm32-wasip1>@emnapi/runtime': '2.0.0-beta.2'
    'browserslist@4.28.9>caniuse-lite': '1.0.30001810'
    difflib: 'https://codeload.github.com/postlight/difflib.js/tar.gz/32e8e38c7fcd935241b9baab71bb432fd9b166ed'
    es-set-tostringtag: 'npm:@nolyfill/es-set-tostringtag@^1'
    'google-play-scraper>got': '^14.6.4'
    'google-play-scraper>ramda': '^0.32.0'
    'google-play-scraper>tough-cookie': '^6.0.0'
    hasown: 'npm:@nolyfill/hasown@^1'
    'header-generator>browserslist': '4.28.9'
    'rss-parser@3.13.0>entities': '^8.1.0'
    'rss-parser@3.13.0>xml2js': '^0.6.2'
    safe-buffer: 'npm:@nolyfill/safe-buffer@^1'
    safer-buffer: 'npm:@nolyfill/safer-buffer@^1'
    side-channel: 'npm:@nolyfill/side-channel@^1'

patchedDependencies:
    'rss-parser@3.13.0': patches/rss-parser@3.13.0.patch
