- name: Install RSSHub
  hosts: localhost
  become: true
  vars_prompt:
      - name: domain_name
        prompt: What is the domain name (without www, e.g. rsshub.example.com)? Use "http://localhost" for development in Vagrant VM.
        private: no
  tasks:
      - name: Check OS
        fail:
            msg: This playbook can only be run on Ubuntu 26.04 at this moment
        when: ansible_distribution != 'Ubuntu' or ansible_distribution_version != '26.04'
      - name: Install GPG keys for repos
        get_url:
            url: '{{ item.url }}'
            dest: '/etc/apt/keyrings/{{ item.name }}.asc'
        loop:
            - { name: nodesource, url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key }
            - { name: docker, url: https://download.docker.com/linux/ubuntu/gpg }
            - { name: caddy, url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key }
      - name: Install repos
        apt_repository:
            repo: '{{ item }}'
            state: present
            update_cache: yes
        loop:
            - deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_24.x nodistro main
            - deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu resolute stable
            - deb [signed-by=/etc/apt/keyrings/caddy.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
      - name: Install prerequisites
        apt:
            name:
                - nodejs
                - build-essential
                - redis-server
                - docker-ce
                - python3-docker
                - caddy
            state: present
            update_cache: yes
      - name: Install pnpm
        command: npm install -g corepack@latest
      - name: Enable pnpm
        command: corepack enable pnpm
      - name: Pull docker image for browserless
        docker_image:
            name: ghcr.io/browserless/chromium
            source: pull
      - name: Start redis
        systemd:
            state: restarted
            enabled: yes
            name: redis-server
            daemon_reload: yes
      - name: Copy caddy configuration
        template:
            src: rsshub.Caddyfile
            dest: /etc/caddy/Caddyfile
      - name: Start caddy
        systemd:
            state: restarted
            enabled: yes
            name: caddy
            daemon_reload: yes
      - name: Create and start browserless container
        docker_container:
            name: browserless
            image: ghcr.io/browserless/chromium
            state: started
            restart_policy: always
            env:
                TOKEN: rsshub
            published_ports:
                - '3000:3000'
      - name: Create the user
        user:
            name: rsshub
            create_home: true
            shell: /bin/bash
      - name: Clone the repo
        git:
            repo: https://github.com/DIYgod/RSSHub.git
            dest: /home/rsshub/app
            update: yes
      - name: Install repo dependencies
        command: pnpm install --frozen-lockfile
        args:
            chdir: /home/rsshub/app
        environment:
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
      - name: Build the app
        command: pnpm build
        args:
            chdir: /home/rsshub/app
      - name: Copy configuration
        copy:
            src: rsshub.env
            dest: /home/rsshub/app/.env
      - name: Own repo to the user
        file:
            path: /home/rsshub/app
            owner: rsshub
            group: rsshub
            recurse: yes
      - name: Install the systemd unit
        copy:
            src: rsshub.service
            dest: /etc/systemd/system/rsshub.service
      - name: Start the systemd service
        systemd:
            state: restarted
            enabled: yes
            name: rsshub
            daemon_reload: yes
